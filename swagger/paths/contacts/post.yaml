tags:
  - Contacts
summary: Create contact by id
operationId: createContact
description: 'Create contact by id'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
          - photo
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380000536888'
          contactType:
            description: "Contact's type"
            type: string
            enum: ['personal', 'home', 'work']
            example: work
            default: personal
          email:
            description: "Contact's email"
            type: string
            example: test@gmail.com
            default: null
          isFavourite:
            description: 'Is the contact a favorite'
            type: boolean
            example: true
            default: false
          photo:
            description: "Link to contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
