security: []
tags:
  - Auth
summary: Get Google OAuth URL
operationId: getGoogleOAuthUrl
description: Returns Google OAuth URL for login
responses:
  '200':
    description: OAuth URL returned
    content:
      application/json:
        schema:
          type: object
          properties:
            url:
              type: string
              example: https://accounts.google.com/o/oauth2/auth?...
  '400':
    description: OAuth service unavailable or misconfigured
    content:
      application/json:
        schema:
          type: object
          properties:
            message:
              type: string
              example: Google OAuth configuration error
  '500':
    $ref: '../../components/responses/500.yaml'
